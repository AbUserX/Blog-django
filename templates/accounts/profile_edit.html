{% extends "base.html" %}

{% block title %}Editar perfil{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4">Editar perfil</h1>
    <form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=user_form %}
        {% include "includes/form_fields.html" with form=profile_form %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
