{% extends "base.html" %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="mx-auto card card-body shadow-sm" style="max-width: 520px;">
    <h1 class="h4 mb-3">Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
    </form>
    <p class="mt-3 mb-0 small text-center">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</div>
{% endblock %}
