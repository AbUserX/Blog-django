{% extends "base.html" %}

{% block title %}Eliminar post{% endblock %}

{% block content %}
<div class="mx-auto card card-body shadow-sm" style="max-width: 560px;">
    <h1 class="h4">Eliminar publicación</h1>
    <p>¿Seguro que querés eliminar "<strong>{{ object.title }}</strong>"? Esta acción no se puede deshacer.</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
